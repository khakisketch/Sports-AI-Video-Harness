<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">대화로 설계하고, 근거를 남기며 제작합니다.</title><desc id="desc">스포츠 콘텐츠 제작 시스템 구축 결과. 기획·연출, 미리보기·편집, 검토·수정을 하나의 작업 공간에서 연결합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#626262" stroke-width="1.3"/></marker></defs>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" fill="#191919">
<rect x="0" y="0" width="1200" height="450" rx="0" fill="white" stroke="none"/>
<rect x="1" y="1" width="1198" height="448" rx="0" fill="#f6f6f3" stroke="#d5d5d1"/>
<text x="56" y="53" font-size="18" font-weight="600" fill="#626262" text-anchor="start">SPORTS AI VIDEO HARNESS</text>
<text x="1144" y="53" font-size="18" font-weight="500" fill="#626262" text-anchor="end">시스템 구축 결과</text>
<path d="M56 78 H1144" fill="none" stroke="#626262" stroke-width="1.5"/>
<text x="56" y="150" font-size="51" font-weight="700" fill="#191919" text-anchor="start">대화로 설계하고,</text>
<text x="56" y="216" font-size="51" font-weight="700" fill="#191919" text-anchor="start">근거를 남기며 제작합니다.</text>
<text x="56" y="268" font-size="23" font-weight="400" fill="#626262" text-anchor="start">회사의 기준과 전문 지침을 실제 제작 도구에 연결하는 AI 에이전트 환경</text>
<rect x="56" y="318" width="344" height="86" rx="12" fill="white" stroke="#d5d5d1"/>
<text x="78" y="351" font-size="24" font-weight="650" fill="#191919" text-anchor="start">기획·연출</text>
<text x="78" y="381" font-size="19" font-weight="400" fill="#626262" text-anchor="start">시청자와 장면의 목적부터</text>
<rect x="428" y="318" width="344" height="86" rx="12" fill="white" stroke="#d5d5d1"/>
<text x="450" y="351" font-size="24" font-weight="650" fill="#191919" text-anchor="start">미리보기·편집</text>
<text x="450" y="381" font-size="19" font-weight="400" fill="#626262" text-anchor="start">기존 자료와 제작 도구를 조합</text>
<rect x="800" y="318" width="344" height="86" rx="12" fill="white" stroke="#d5d5d1"/>
<text x="822" y="351" font-size="24" font-weight="650" fill="#191919" text-anchor="start">검토·수정</text>
<text x="822" y="381" font-size="19" font-weight="400" fill="#626262" text-anchor="start">실제 결과와 확인 기록을 연결</text>
</g></svg>
