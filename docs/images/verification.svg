<title id="title">공개판 검증 결과 요약</title><desc id="desc">2026년 10월 20일, 동일한 150개 오프라인 자동 검사를 작업 폴더·새 복제·ZIP 해제·GitHub Linux 환경에서 통과했습니다. 역할 설정 일치와 공개 파일 점검도 통과했습니다. 실제 기록의 요약이며 화면 캡처가 아닙니다.</desc>
